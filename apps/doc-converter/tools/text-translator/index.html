<!DOCTYPE html>
<html lang="en" data-theme="doc">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Translate text between 50+ languages instantly. Free, fast, and private. No account required." />
  <title>Text Translator · Chronos Toolbox</title>
  <link rel="icon" type="image/png" href="../../../../packages/images/white-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../packages/ui/tokens.css" />
  <link rel="stylesheet" href="../../../../packages/ui/shared.css" />
  <script src="js/main.js"></script>
</head>
<body>
<!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="../../../home/index.html" class="logo" aria-label="Chronos Toolbox home">
        <svg class="logo__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        <span class="logo__text">Chronos <strong>Toolbox</strong></span>
      </a>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <span class="breadcrumb__sep">/</span>
        <a href="../../index.html">Doc Converter</a>
        <span class="breadcrumb__sep">/</span>
        <span>Text Translator</span>
      </nav>
      <a href="../../index.html" class="btn-back" id="btn-back">
        <svg class="btn-back__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </a>
    </div>
  </header>

  <!-- Hero -->
  <section class="tool-hero">
    <h1 class="tool-hero__title">Text <span>Translator</span></h1>
    <p class="tool-hero__subtitle">Translate text between 50+ languages instantly. Powered by MyMemory — free translation API.</p>
  </section>

  <!-- Workspace -->
  <main class="workspace">

    <div class="translator-container">
      
      <!-- Source Text -->
      <div class="text-area-wrapper">
        <div class="lang-select-wrapper">
          <label for="source-lang" class="visually-hidden">Source language</label>
          <select id="source-lang" class="lang-select control-row-input" style="width:100%;">
            <option value="en" selected>English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="ru">Russian</option>
            <option value="zh">Chinese</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="ar">Arabic</option>
            <option value="hi">Hindi</option>
            <option value="tr">Turkish</option>
            <option value="pl">Polish</option>
            <option value="nl">Dutch</option>
            <option value="sv">Swedish</option>
            <option value="da">Danish</option>
            <option value="fi">Finnish</option>
            <option value="no">Norwegian</option>
            <option value="uk">Ukrainian</option>
            <option value="cs">Czech</option>
            <option value="el">Greek</option>
            <option value="he">Hebrew</option>
            <option value="th">Thai</option>
            <option value="vi">Vietnamese</option>
            <option value="id">Indonesian</option>
            <option value="ms">Malay</option>
            <option value="ro">Romanian</option>
            <option value="hu">Hungarian</option>
            <option value="bg">Bulgarian</option>
            <option value="hr">Croatian</option>
            <option value="sk">Slovak</option>
            <option value="sl">Slovenian</option>
            <option value="et">Estonian</option>
            <option value="lv">Latvian</option>
            <option value="lt">Lithuanian</option>
            <option value="ca">Catalan</option>
            <option value="gl">Galician</option>
            <option value="eu">Basque</option>
            <option value="cy">Welsh</option>
            <option value="ga">Irish</option>
            <option value="mt">Maltese</option>
            <option value="af">Afrikaans</option>
            <option value="sw">Swahili</option>
            <option value="tl">Filipino</option>
            <option value="is">Icelandic</option>
            <option value="mk">Macedonian</option>
            <option value="sq">Albanian</option>
            <option value="bs">Bosnian</option>
            <option value="sr">Serbian</option>
          </select>
        </div>
        <label for="input-text" class="visually-hidden">Text to translate</label>
        <textarea id="input-text" class="text-area control-row-input" placeholder="Enter text to translate..."></textarea>
        <div class="char-count">
          <span id="char-count">0 / 5000</span>
        </div>
      </div>

      <!-- Middle Controls -->
      <div class="middle-controls">
        <button id="btn-swap" class="swap-btn" title="Swap languages" aria-label="Swap source and target languages"><svg aria-hidden="true" focusable="false"><use href="/packages/ui/icons.svg#icon-refresh"/></svg></button>
        <button id="btn-translate" class="btn-primary">Translate</button>
        <div class="action-buttons">
          <button id="btn-copy" class="btn-icon" title="Copy translation" aria-label="Copy translation"><svg aria-hidden="true" focusable="false"><use href="/packages/ui/icons.svg#icon-copy"/></svg></button>
          <button id="btn-clear" class="btn-icon" title="Clear all" aria-label="Clear all"><svg aria-hidden="true" focusable="false"><use href="/packages/ui/icons.svg#icon-trash"/></svg></button>
        </div>
      </div>

      <!-- Target Text -->
      <div class="text-area-wrapper">
        <div class="lang-select-wrapper">
          <label for="target-lang" class="visually-hidden">Target language</label>
          <select id="target-lang" class="lang-select control-row-input" style="width:100%;">
            <option value="en">English</option>
            <option value="es" selected>Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="ru">Russian</option>
            <option value="zh">Chinese</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="ar">Arabic</option>
            <option value="hi">Hindi</option>
            <option value="tr">Turkish</option>
            <option value="pl">Polish</option>
            <option value="nl">Dutch</option>
            <option value="sv">Swedish</option>
            <option value="da">Danish</option>
            <option value="fi">Finnish</option>
            <option value="no">Norwegian</option>
            <option value="uk">Ukrainian</option>
            <option value="cs">Czech</option>
            <option value="el">Greek</option>
            <option value="he">Hebrew</option>
            <option value="th">Thai</option>
            <option value="vi">Vietnamese</option>
            <option value="id">Indonesian</option>
            <option value="ms">Malay</option>
            <option value="ro">Romanian</option>
            <option value="hu">Hungarian</option>
            <option value="bg">Bulgarian</option>
            <option value="hr">Croatian</option>
            <option value="sk">Slovak</option>
            <option value="sl">Slovenian</option>
            <option value="et">Estonian</option>
            <option value="lv">Latvian</option>
            <option value="lt">Lithuanian</option>
            <option value="ca">Catalan</option>
            <option value="gl">Galician</option>
            <option value="eu">Basque</option>
            <option value="cy">Welsh</option>
            <option value="ga">Irish</option>
            <option value="mt">Maltese</option>
            <option value="af">Afrikaans</option>
            <option value="sw">Swahili</option>
            <option value="tl">Filipino</option>
            <option value="is">Icelandic</option>
            <option value="mk">Macedonian</option>
            <option value="sq">Albanian</option>
            <option value="bs">Bosnian</option>
            <option value="sr">Serbian</option>
          </select>
        </div>
        <label for="output-text" class="visually-hidden">Translation result</label>
        <textarea id="output-text" class="text-area control-row-input" readonly placeholder="Translation will appear here..."></textarea>
        <div class="status-bar" aria-live="polite" aria-atomic="true">
          <span id="status-text">Ready to translate</span>
        </div>
      </div>

    </div>

  </main>

  <footer class="site-footer">
    <img class="footer-logo" src="../../../../packages/images/white-logo.png" alt="Chronos Toolbox" />
    <p class="footer-text">Part of <a href="../../../home/index.html">Chronos Toolbox</a> &nbsp;·&nbsp; Translation powered by MyMemory — free translation API.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
